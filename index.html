<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>🍪 My Crumbl Journal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fdf6f0;
      color: #2d1a0e;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #ff6b9d 0%, #ff3d7f 100%);
      color: white;
      padding: 28px 24px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(255, 61, 127, 0.3);
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 4px;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    /* STATS BAR */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      background: white;
      padding: 14px 24px;
      border-bottom: 1px solid #f0ddd3;
      flex-wrap: wrap;
    }
    .stat {
      text-align: center;
    }
    .stat-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ff3d7f;
    }
    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      margin-top: 1px;
    }

    /* CONTROLS */
    .controls {
      max-width: 1100px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 2px solid #f0ddd3;
      border-radius: 50px;
      font-size: 0.95rem;
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: #ff6b9d; }
    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #ccc;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 8px 16px;
      border-radius: 50px;
      border: 2px solid #f0ddd3;
      background: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #888;
    }
    .filter-tab:hover { border-color: #ff6b9d; color: #ff3d7f; }
    .filter-tab.active {
      background: #ff3d7f;
      border-color: #ff3d7f;
      color: white;
    }

    /* GRID */
    .grid {
      max-width: 1100px;
      margin: 20px auto 40px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* CARD */
    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #fdf0f5;
      display: block;
    }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #fdf0f5 0%, #fce8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .card-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 8px;
      border-radius: 50px;
      margin-bottom: 6px;
    }
    .badge-classic {
      background: #fff3cd;
      color: #856404;
    }
    .badge-top25 {
      background: #fce8f0;
      color: #c2185b;
    }
    .badge-weekly {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .card-body {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-name {
      font-size: 1rem;
      font-weight: 700;
      color: #1a0a04;
      line-height: 1.3;
    }
    .card-desc {
      font-size: 0.82rem;
      color: #888;
      line-height: 1.5;
      flex: 1;
    }

    /* STATUS BUTTONS */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-status {
      flex: 1;
      padding: 7px 10px;
      border-radius: 50px;
      border: 2px solid #f0ddd3;
      background: white;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-status:hover { border-color: #ff6b9d; color: #ff3d7f; }
    .btn-status.active-wishlist {
      background: #fff0f7;
      border-color: #ff6b9d;
      color: #ff3d7f;
    }
    .btn-status.active-tried {
      background: #f0fff4;
      border-color: #38a169;
      color: #38a169;
    }

    /* RATING PANEL */
    .rating-panel {
      margin-top: 10px;
      padding: 12px;
      background: #fdf6f0;
      border-radius: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .rating-panel.visible { display: flex; }

    .stars {
      display: flex;
      gap: 4px;
    }
    .star {
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.1s;
      color: #ddd;
      user-select: none;
    }
    .star:hover, .star.filled { color: #fbbf24; }
    .star:hover { transform: scale(1.2); }

    .notes-input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #f0ddd3;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      outline: none;
      background: white;
      color: #333;
      transition: border-color 0.2s;
    }
    .notes-input:focus { border-color: #ff6b9d; }
    .notes-input::placeholder { color: #ccc; }

    .rating-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #bbb;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #bbb;
      font-size: 1.1rem;
    }
    .no-results span { font-size: 3rem; display: block; margin-bottom: 12px; }
  </style>
</head>

let state = {};
try {
  state = JSON.parse(localStorage.getItem('crumbl-journal') || '{}');
} catch(e) {}

function save() {
  localStorage.setItem('crumbl-journal', JSON.stringify(state));
}

function getEntry(id) {
  return state[id] || { status: 'none', rating: 0, notes: '' };
}

let activeFilter = 'all';

  activeFilter = f;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleStatus(id, newStatus) {
  const entry = getEntry(id);
  // If clicking the same active status, remove it
  entry.status = entry.status === newStatus ? 'none' : newStatus;
  state[id] = entry;
  save();
  render();
}

function setRating(id, rating) {
  const entry = getEntry(id);
  entry.rating = entry.rating === rating ? 0 : rating;
  state[id] = entry;
  save();
  renderStars(id, entry.rating);
  updateStats();
}

function saveNotes(id, val) {
  const entry = getEntry(id);
  entry.notes = val;
  state[id] = entry;
  save();
}

function renderStars(id, rating) {
  const container = document.getElementById('stars-' + id);
  if (!container) return;
  container.querySelectorAll('.star').forEach((s, i) => {
    s.classList.toggle('filled', i < rating);
  });
}

function updateStats() {
  const entries = Object.values(state);
  const tried = entries.filter(e => e.status === 'tried').length;
  const wishlist = entries.filter(e => e.status === 'wishlist').length;
  const ratings = entries.filter(e => e.status === 'tried' && e.rating > 0).map(e => e.rating);
  const avg = ratings.length ? (ratings.reduce((a,b) => a+b, 0) / ratings.length).toFixed(1) : '—';

  document.getElementById('stat-tried').textContent = tried;
  document.getElementById('stat-wishlist').textContent = wishlist;
  document.getElementById('stat-avg').textContent = avg === '—' ? '—' : avg + ' ★';
  document.getElementById('stat-total').textContent = COOKIES.length;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');

  let filtered = COOKIES.filter(c => {
    const entry = getEntry(c.id);
    const matchesSearch = c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q);
    const matchesFilter =
      activeFilter === 'all' ||
      (activeFilter === 'tried' && entry.status === 'tried') ||
      (activeFilter === 'wishlist' && entry.status === 'wishlist') ||
      (activeFilter === 'none' && entry.status === 'none');
    return matchesSearch && matchesFilter;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results"><span>🍪</span>No cookies found!</div>';
    updateStats();
    return;
  }

  grid.innerHTML = filtered.map(cookie => {
    const entry = getEntry(cookie.id);
    const isTried = entry.status === 'tried';
    const isWishlist = entry.status === 'wishlist';

    const imgHtml = cookie.img
      ? `<img class="card-img" src="${cookie.img}" alt="${cookie.name}" loading="lazy" />`
      : `<div class="card-img-placeholder">🍪</div>`;

    const badgeHtml = cookie.category === 'classic'
      ? `<span class="card-badge badge-classic">⭐ Classic</span>`
      : cookie.category === 'weekly'
      ? `<span class="card-badge badge-weekly">🗓 This Week</span>`
      : `<span class="card-badge badge-top25">#${cookie.rank} Top 25</span>`;

    const starsHtml = [1,2,3,4,5].map(i =>
      `<span class="star ${i <= entry.rating ? 'filled' : ''}" onclick="setRating('${cookie.id}', ${i})">★</span>`
    ).join('');

    return `
      <div class="card" id="card-${cookie.id}">
        ${imgHtml}
        <div class="card-body">
          ${badgeHtml}
          <div class="card-name">${cookie.name}</div>
          <div class="card-desc">${cookie.desc}</div>

          <div class="card-actions">
            <button class="btn-status ${isWishlist ? 'active-wishlist' : ''}"
              onclick="toggleStatus('${cookie.id}', 'wishlist')">
              <span>${isWishlist ? '❤️' : '🤍'}</span>
              <span>Want to Try</span>
            </button>
            <button class="btn-status ${isTried ? 'active-tried' : ''}"
              onclick="toggleStatus('${cookie.id}', 'tried')">
              <span>${isTried ? '✅' : '○'}</span>
              <span>Tried It</span>
            </button>
          </div>

          <div class="rating-panel ${isTried ? 'visible' : ''}" id="panel-${cookie.id}">
            <div class="rating-label">Your Rating</div>
            <div class="stars" id="stars-${cookie.id}">${starsHtml}</div>
            <textarea class="notes-input"
              placeholder="Add your notes… Was it warm? Chilled? Worth the hype?"
              oninput="saveNotes('${cookie.id}', this.value)"
            >${entry.notes}</textarea>
          </div>
        </div>
      </div>
    `;
  }).join('');

  updateStats();
}

render();
</script>
</body>
</html>
